project:
  type: website
  output-dir: compiled_html_site

website:
  description: "Down-under motorbike reviews and lifestyle blog. Where every bike gets a lap of the lake!"
  site-url: https://your-website-url.example.com # you must change this appropriately for RSS feeds to work properly
  title: "The Great Lake Motorbike Blog"
  favicon: images/favicon.png
  navbar:
    right:
      - about.qmd
format:
  html:
    anchor-sections: true
    smooth-scroll: true
    toc: true
    toc-title: Contents
    theme:
      light:
        - flatly
        - custom.scss
      dark:
        - darkly
        - custom.scss
